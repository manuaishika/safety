[project]
name = "indicsafe"
version = "0.1.0"
description = "Multilingual safety-behaviour evaluation infrastructure for Indian languages"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "inspect-ai>=0.3.286",
    "matplotlib>=3.11.2",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "scipy>=1.17.1",
    "statsmodels>=0.15.0",
    "typer>=0.12",
]

[project.scripts]
indicsafe = "indicsafe.cli:app"

[project.optional-dependencies]
local = [
    "openai>=3.41.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML",
    "pandas-stubs>=3.1.0.261029",
    "scipy-stubs>=1.17.1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/indicsafe"]

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks"]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/indicsafe/validation/report.py" = ["E501"]  # markdown table rendering
"src/indicsafe/analysis/report.py" = ["E501"]  # markdown report rendering

[tool.mypy]
strict = true
files = ["src/indicsafe"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["torch", "transformers", "IndicTransToolkit", "IndicTransToolkit.*", "statsmodels", "statsmodels.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["local_model: needs a local Ollama model; skipped unless Ollama is detected"]
filterwarnings = ["ignore:The .initial. parameter is deprecated:DeprecationWarning"]
